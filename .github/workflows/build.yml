name: Build & live check

on:
  push:
    branches: [main, app-refresh-2026]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check production app
        if: github.ref == 'refs/heads/main'
        run: curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 https://triton-invitational-planner-elmu-2020.vercel.app/ -o /dev/null
      - name: Check Firebase planner access
        if: github.ref == 'refs/heads/main'
        run: |
          CODE=$(curl -sS -o /tmp/firestore.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/tableplanner123/databases/%28default%29/documents/planner/main?key=AIzaSyAGU-ZKIQEdk6M37Jt65S-tMydQsoaswh4")
          echo "Firestore HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then cat /tmp/firestore.json; exit 1; fi
