name: Build & live check

on:
  push:
    branches: [main, app-refresh-2026]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check production app
        if: github.ref == 'refs/heads/main'
        run: |
          BASE="https://triton-invitational-planner-elmu-2020.vercel.app"
          for ATTEMPT in $(seq 1 12); do
            if curl -fsSL --max-time 20 "${BASE}/" -o /tmp/index.html; then
              JS=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
              if [ -n "${JS}" ] && curl -fsSL --max-time 20 "${BASE}${JS}" -o /tmp/app.js; then
                if grep -q "LOCAL MODE" /tmp/app.js; then
                  echo "Production bundle contains Firebase fallback."
                  exit 0
                fi
              fi
            fi
            echo "Waiting for refreshed deployment (${ATTEMPT}/12)…"
            sleep 5
          done
          echo "Production bundle did not expose the expected fallback marker."
          exit 1
      - name: Check Firebase planner access
        if: github.ref == 'refs/heads/main'
        run: |
          CODE=$(curl -sS -o /tmp/firestore.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/tableplanner123/databases/%28default%29/documents/planner/main?key=AIzaSyAGU-ZKIQEdk6M37Jt65S-tMydQsoaswh4")
          echo "Firestore HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::warning::Firebase sync is unavailable; INV-PRO will use its local fallback mode."
            cat /tmp/firestore.json
          fi
