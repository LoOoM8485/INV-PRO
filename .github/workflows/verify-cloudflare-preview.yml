name: Verify final live app

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check final INV-PRO deployment
        run: |
          BASE="https://triton-inv-pro-final-elmu-2020.vercel.app"
          for ATTEMPT in $(seq 1 24); do
            if curl -fsSL --max-time 10 "${BASE}/" -o /tmp/index.html; then
              JS=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
              CSS=$(grep -oE 'href="/assets/[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
              JS_OK=0
              CSS_OK=0
              if [ -n "${JS}" ] && curl -fsSL --max-time 10 "${BASE}${JS}" -o /tmp/app.js; then
                grep -q "LOCAL MODE" /tmp/app.js && JS_OK=1 || true
              fi
              if [ -n "${CSS}" ] && curl -fsSL --max-time 10 "${BASE}${CSS}" -o /tmp/app.css; then
                grep -q -- "--inv-fullscreen-release:20260904" /tmp/app.css && CSS_OK=1 || true
              fi
              if [ "${JS_OK}" = "1" ] && [ "${CSS_OK}" = "1" ]; then
                echo "Final INV-PRO deployment is live with fallback and fullscreen release."
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
